[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lila-pipeline"
version = "0.1.0"
description = "LILA BLACK player-journey ETL: Parquet → canonical JSON"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=14.0.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.setuptools.packages.find]
where = [".."]
include = ["pipeline*", "pipeline.src*"]
